<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pusat Komando Akademik</title>
<style>
:root{--bg:#eceff3;--sf:#fff;--ink:#16203a;--mu:#66708a;--ln:#d8dde7;--ac:#3d5afe;--acs:#e6eaff;--r:#e5484d;--o:#f08a24;--y:#d9a400;--g:#2e9e6b;--rad:4px}
[data-theme=dark]{--bg:#10131c;--sf:#181c28;--ink:#e8ecf6;--mu:#8b94ad;--ln:#2a3040;--ac:#7c93ff;--acs:#232a4a}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-bottom:2px solid var(--ln);background:none;border-radius:0;padding:4px 1px;margin-right:6px;font-weight:600}
button:hover{border-bottom-color:var(--ac);color:var(--ac)}
button.p{background:var(--ink);color:var(--bg);border:0;border-radius:2px;padding:7px 16px;box-shadow:inset 4px 0 0 var(--ac)}
button.p:hover{background:var(--ac);color:var(--bg);box-shadow:none}
button.d{color:var(--r)}button.d:hover{border-bottom-color:var(--r);color:var(--r)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--sf);border-right:1px solid var(--ln);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:800;font-size:17px;letter-spacing:-.3px;padding:0 8px 14px;line-height:1.2}
.brand small{display:block;font-weight:500;color:var(--mu);font-size:12px}
nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:0;border-left:3px solid transparent;margin:0}
nav button.on{border-left-color:var(--ac);color:var(--ac);background:var(--acs)}
main{padding:20px 28px;max-width:1200px;width:100%}
.top{display:flex;gap:10px;align-items:center;margin-bottom:20px;position:relative}
#q{flex:1;padding:9px 14px;border:1px solid var(--ln);border-radius:10px;background:var(--sf)}
#res{position:absolute;top:46px;left:0;width:min(520px,100%);background:var(--sf);border:1px solid var(--ln);border-radius:10px;z-index:5;max-height:340px;overflow:auto;display:none}
#res div{padding:8px 14px;cursor:pointer;border-bottom:1px solid var(--ln)}#res div:hover{background:var(--acs)}
#res small,.mu{color:var(--mu)}
.bd{background:var(--r);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;margin-left:4px}
h1{font-size:26px;letter-spacing:-.6px}h2{font-size:16px;margin-bottom:10px}
.hero{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
.big{font-size:44px;font-weight:800;letter-spacing:-2px;line-height:1;text-align:right}
.big small{display:block;font-size:12px;letter-spacing:0;font-weight:500;color:var(--mu);margin-top:4px}
.grid{display:grid;gap:14px;margin-bottom:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--rad);padding:16px}
.st b{font-size:30px;display:block;letter-spacing:-1px}
.st{border-left:4px solid var(--ac)}
.row{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:8px;border:1px solid var(--ln);border-left:4px solid var(--ln);margin-bottom:8px;background:var(--sf)}
.row>.f{flex:1;min-width:0}
.row b{display:block}
.rU,.rT{border-left-color:var(--r)}.rH{border-left-color:var(--o)}.rM{border-left-color:var(--y)}.rL{border-left-color:var(--g)}.rD{opacity:.6}
.tag{font-size:12px;padding:1px 8px;border-radius:2px;background:var(--acs);color:var(--ac);white-space:nowrap}
.tU,.tT{background:var(--r);color:#fff}.tH{background:var(--o);color:#fff}.tM{background:var(--y);color:#fff}.tL{background:var(--g);color:#fff}
.bar{height:8px;background:var(--ln);border-radius:5px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--ac)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.tabs button.on{color:var(--ac);border-bottom-color:var(--ac)}
.sp{flex:1}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--ln);text-align:left}
td input{width:62px;padding:4px;border:1px solid var(--ln);border-radius:6px;background:var(--bg)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wk>div{min-height:90px}
.ev{font-size:12px;padding:3px 6px;border-radius:6px;margin-top:4px;background:var(--acs);border-left:3px solid var(--ac)}
.ev.deadline{background:#fde8e9;border-color:var(--r);color:#8a1f24}.ev.meeting{background:#e2f5ec;border-color:var(--g);color:#14573a}
[data-theme=dark] .ev.deadline{background:#3a1c20;color:#f3b8bb}[data-theme=dark] .ev.meeting{background:#17322a;color:#a5e0c4}
.ev.tagihan{background:#fdf3d9;border-color:var(--y);color:#6b5000}[data-theme=dark] .ev.tagihan{background:#3a3115;color:#f1dd9b}.dot.tagihan{background:var(--y)}
.mo{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mo button{min-height:58px;text-align:left;padding:6px;font-size:13px}.mo button.now{border-color:var(--ac);font-weight:700}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:2px;background:var(--ac)}.dot.deadline{background:var(--r)}.dot.meeting{background:var(--g)}
dialog{border:1px solid var(--ln);border-radius:6px;padding:20px;width:min(520px,94vw);background:var(--sf);color:var(--ink)}
dialog::backdrop{background:#0008}
dialog label{display:block;margin-bottom:10px;font-size:13px;color:var(--mu)}
dialog input,dialog select,dialog textarea{display:block;width:100%;padding:8px;margin-top:3px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink)}
dialog input[type=range]{padding:0}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.timer{font-size:64px;font-weight:800;text-align:center;letter-spacing:-3px;margin:10px 0}
.hint{font-size:13px;color:var(--mu);margin-top:4px}
@media(max-width:820px){#app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.brand{width:100%}nav{display:flex;flex-wrap:wrap}nav button{width:auto}.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}main{padding:14px}.wk{grid-template-columns:1fr}.big{text-align:left}}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
</style>
</head>
<body>
<div id="app">
<aside>
 <div class="brand">Pusat Komando<br>Akademik<small>Masukkan sekali, hubungkan semuanya</small></div>
 <nav id="nav"></nav>
 <span class="sp"></span>
 <button data-a="theme">Ganti tema</button>
 <button data-a="reset" class="d">Reset data contoh</button>
</aside>
<main>
 <div class="top">
  <input id="q" placeholder="Cari mata kuliah, tugas, meeting, catatan… (tekan /)" autocomplete="off">
  <div id="res"></div>
  <button data-a="add" class="p">+ Tambah</button>
 </div>
 <section id="v"></section>
</main>
</div>
<dialog id="m"></dialog>

<script>
/* ===== Utilitas & data ===== */
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const DAYS=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],MON=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const TYPES=['PR','Project','Quiz','Ujian','Laporan','Presentasi'],STAT=['BACKLOG','BELUM DIMULAI','SEDANG DIKERJAKAN','REVIEW','SELESAI'],PRIO=['Rendah','Normal','Tinggi','Urgent'];
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addD=(n,t='00:00')=>{const d=new Date();d.setDate(d.getDate()+n);return ds(d)+'T'+t};
const fmt=d=>{d=new Date(d);return `${DAYS[d.getDay()].slice(0,3)}, ${d.getDate()} ${MON[d.getMonth()].slice(0,3)} ${pad(d.getHours())}.${pad(d.getMinutes())}`};
const KEY='ack_v1';
function seed(){const c=(name,code,lect,sks,day,start,end,room)=>({id:uid(),name,code,lect,sks,sem:1,day,start,end,room,w:[20,10,30,40],sc:{}});
 const cs=[c('Algoritma & Pemrograman','IF101','Dr. Budi Santoso',3,1,'08:00','10:30','FT-204'),c('Logika Informatika','IF102','Dr. Sari Wulandari',3,2,'10:00','11:40','FT-110'),c('Bahasa Inggris','UM103','Ratna Dewi, M.Pd.',2,3,'10:00','11:40','Lab Bahasa'),c('Organisasi Komputer','IF104','Ir. Hendra Gunawan',3,4,'10:00','12:30','FT-305')];
 cs[0].sc={tugas:85,quiz:80};
 const t=(title,i,type,due,prio,prog,status,done)=>({id:uid(),title,course:cs[i].id,type,due,prio,prog,status,desc:'',orig:due,doneAt:done});
 return{name:'Raja',dark:0,courses:cs,focus:[{d:ds(new Date()),min:45}],notes:[{id:uid(),course:cs[0].id,title:'Pertemuan 1',text:'Flowchart: terminator, proses, keputusan, I/O.'}],
 tasks:[t('Tugas Logika Proposisional',1,'PR',addD(0,'23:59'),2,20,'SEDANG DIKERJAKAN'),t('Essay Bahasa Inggris',2,'Laporan',addD(2,'17:00'),1,40,'SEDANG DIKERJAKAN'),t('Praktikum Organisasi Komputer',3,'Project',addD(4,'20:00'),1,10,'BELUM DIMULAI'),t('Project 1 Algoritma',0,'Project',addD(2,'23:59'),2,70,'REVIEW'),t('Kuis Review Flowchart',0,'Quiz',addD(-1,'12:00'),1,60,'SEDANG DIKERJAKAN'),t('Pseudocode',0,'PR',addD(-3,'23:59'),1,100,'SELESAI',addD(-4,'20:00')),t('Flowchart',0,'PR',addD(-6,'23:59'),1,100,'SELESAI',addD(-7,'10:00'))],
 meetings:[{id:uid(),name:'Konsultasi Project 1',who:'Dosen',goal:'Konsultasi tugas',date:addD(2).slice(0,10),start:'14:00',end:'15:00',place:'Ruang Dosen',bring:'Laptop, Laporan',agenda:'Review struktur program',note:'',done:0,result:'',fu:''}]}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||seed();S.fin=S.fin||finSeed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const get=(k,id)=>S[k].find(x=>x.id==id),crs=id=>get('courses',id)||{name:'—',lect:'—',sks:0};
const ui={v:'dash',cal:'Pekan',cd:new Date(),tf:'Semua',nf:'Semua',sem:1};

/* ===== Mesin batas waktu, risiko & prioritas ===== */
const hrs=t=>(new Date(t.due)-Date.now())/36e5;
const left=h=>{const a=Math.abs(h);return (h<0?'terlambat ':'')+(a<48?`${Math.floor(a)} j ${Math.floor((a%1)*60)} m`:`${Math.round(a/24)} hari`)+(h<0?'':' lagi')};
function risk(t){if(t.status=='SELESAI')return'D';const h=hrs(t);if(h<0)return'T';if(h<=1)return'U';if(h<=24&&t.prog<50)return'H';if(h<=72&&t.prog<70)return'M';return'L'}
const RN={U:'URGENT',T:'TERLAMBAT',H:'HIGH',M:'MEDIUM',L:'LOW',D:'SELESAI'};
function score(t){const h=hrs(t),dr=h<0?100:h<=1?90:h<=24?70:h<=72?45:h<=168?20:5;return dr+t.prio*10+(100-t.prog)*.3+crs(t.course).sks*3}
function advice(t){const h=hrs(t),p=t.prog;if(h<0)return'Sudah lewat tenggat. Selesaikan sekarang atau ubah deadline.';if(h<=24&&p<50)return`Progress baru ${p}%, sisa waktu ${left(h)}. Kerjakan minimal ${Math.min(100,p+20)}% hari ini.`;if(h<=72&&p<70)return`Sisa ${left(h)}, progress ${p}%. Sisihkan satu sesi fokus hari ini.`;return'Aman. Pertahankan ritme.'}
const active=()=>S.tasks.filter(t=>t.status!='SELESAI');
const pr=id=>{const t=S.tasks.filter(x=>x.course==id);return t.length?Math.round(t.reduce((a,x)=>a+(x.status=='SELESAI'?100:x.prog),0)/t.length):0};
const bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;

/* ===== Kalender & waktu luang ===== */
function events(d){const s=ds(d),o=[];
 S.courses.filter(c=>c.day==d.getDay()).forEach(c=>o.push({t:c.start,e:c.end,k:'kuliah',n:c.name,s:c.room}));
 S.tasks.filter(t=>t.due.slice(0,10)==s).forEach(t=>o.push({t:t.due.slice(11),k:'deadline',n:t.title,s:'Deadline'}));
 S.meetings.filter(m=>m.date==s).forEach(m=>o.push({t:m.start,e:m.end,k:'meeting',n:m.name,s:m.place}));
 S.fin.bills.filter(b=>!b.paid&&b.due==s).forEach(b=>o.push({t:'09:00',k:'tagihan',n:b.name+' '+rp(b.amt),s:'Tagihan'}));
 return o.sort((a,b)=>a.t.localeCompare(b.t))}
const mins=t=>+t.slice(0,2)*60+ +t.slice(3,5),hm=n=>`${pad(Math.floor(n/60))}.${pad(n%60)}`;
function freeTime(){const n=new Date(),now=n.getHours()*60+n.getMinutes(),b=events(n).filter(e=>e.e).map(e=>[mins(e.t),mins(e.e)]),o=[];let c=Math.max(420,now);
 for(const[s,e]of b.filter(x=>x[1]>c)){if(s-c>=45)o.push([c,s]);c=Math.max(c,e)}
 if(1260-c>=45)o.push([c,1260]);return o}

/* ===== Notifikasi ===== */
function notifs(){const L=[],n=Date.now();
 S.tasks.forEach(t=>{const r=risk(t),h=hrs(t);if(r=='T')L.push({c:'r',k:'Tugas',t:t.title,s:'Terlambat — '+crs(t.course).name});else if(r=='U'||r=='H')L.push({c:'r',k:'Tugas',t:`Deadline ${left(h)}`,s:t.title+' ('+t.prog+'%)'});else if(r=='M')L.push({c:'y',k:'Tugas',t:`Deadline ${left(h)}`,s:t.title})});
 [0,1].forEach(i=>{const d=new Date();d.setDate(d.getDate()+i);S.courses.filter(c=>c.day==d.getDay()).forEach(c=>{const at=new Date(ds(d)+'T'+c.start);if(at>n&&at-n<864e5)L.push({c:i?'y':'b',k:'Kuliah',t:(i?'Kuliah besok ':'Kuliah hari ini ')+c.start,s:c.name+' • '+c.room})})});
 S.meetings.filter(m=>!m.done&&new Date(m.date+'T'+m.start)-n<1728e5&&new Date(m.date+'T'+m.end)>n).forEach(m=>L.push({c:'g',k:'Meeting',t:'Meeting '+m.date.slice(8)+'/'+m.date.slice(5,7)+' '+m.start,s:m.name}));
 S.tasks.filter(t=>t.src=='meeting'&&t.status!='SELESAI').forEach(t=>L.push({c:'b',k:'Akademik',t:'Follow-up',s:t.title}));
 finAlerts(L);
 return L}

/* ===== Tampilan ===== */
const NAV=[['dash','Dashboard'],['tugas','Tugas & PR'],['kal','Kalender'],['kuliah','Jadwal Kuliah'],['meet','Pertemuan'],['akad','Akademik'],['uang','Keuangan'],['cat','Catatan'],['stat','Statistik'],['notif','Notifikasi']];
const taskRow=(t,x)=>{const r=risk(t),h=hrs(t);return`<div class="row r${r}"><div class="f"><b>${esc(t.title)}</b><span class="mu">${esc(crs(t.course).name)} • ${esc(crs(t.course).lect)} • ${t.type}</span><br><span class="mu">Deadline ${fmt(t.due)}${t.orig!=t.due?` (asal ${fmt(t.orig)})`:''} ${t.status!='SELESAI'?'• '+left(h):''}</span>${r!='D'&&r!='L'?`<div class="hint">${advice(t)}</div>`:''}</div>
 <div style="width:150px">${bar(t.status=='SELESAI'?100:t.prog)}<small class="mu">${t.prog}% • ${t.status}</small></div><span class="tag t${r}">${RN[r]}</span>
 ${x?`<button data-a="fokus" data-id="${t.id}">Fokus</button>`:`<button data-a="p10" data-id="${t.id}">+10%</button><button data-a="doneT" data-id="${t.id}">Selesai</button><button data-a="editT" data-id="${t.id}">Ubah</button>`}</div>`};
const V={uang:()=>finView(),
dash(){const n=new Date(),a=active().sort((x,y)=>score(y)-score(x)),near=[...a].sort((x,y)=>new Date(x.due)-new Date(y.due)),td=events(n),tdd=ds(n),
 dl=a.filter(t=>t.due.slice(0,10)==tdd).length,mt=S.meetings.filter(m=>m.date==tdd).length,ov=Math.round(S.courses.reduce((s,c)=>s+pr(c.id),0)/(S.courses.length||1)),
 h=n.getHours(),gr=h<11?'pagi':h<15?'siang':h<18?'sore':'malam',nx=near.find(t=>hrs(t)>0);
 const na=[...a.slice(0,3).map(t=>({c:risk(t),t:'Selesaikan '+t.title,s:'Deadline '+left(hrs(t)),id:t.id,sc:score(t)}))];
 const tm=new Date();tm.setDate(tm.getDate()+1);S.courses.filter(c=>c.day==tm.getDay()).forEach(c=>na.push({c:'M',t:'Review materi '+c.name,s:'Kuliah besok '+c.start,sc:40}));
 S.meetings.filter(m=>!m.done&&new Date(m.date+'T'+m.start)>n&&new Date(m.date+'T'+m.start)-n<2592e5).forEach(m=>na.push({c:'L',t:'Siapkan: '+m.name,s:'Bawa '+(m.bring||'—')+' • '+m.date.slice(8)+'/'+m.date.slice(5,7)+' '+m.start,sc:35}));
 F0().cats.filter(c=>c.g<2&&bud(c)>0&&used(c)/bud(c)>=.8).forEach(c=>na.push({c:'M',t:'Periksa budget '+c.name,s:Math.round(used(c)/bud(c)*100)+'% terpakai',sc:38}));na.sort((x,y)=>y.sc-x.sc);const ft=freeTime().slice(0,3);
 return`<div class="hero"><div><h1>Selamat ${gr}, <span data-a="nm" style="cursor:pointer" title="Klik untuk ganti nama">${esc(S.name)}</span>.</h1><p class="mu">${DAYS[n.getDay()]}, ${n.getDate()} ${MON[n.getMonth()]} ${n.getFullYear()}</p></div>
 <div class="big">${nx?left(hrs(nx)).replace(' lagi',''):'Bebas'}<small>${nx?'menuju deadline: '+esc(nx.title):'Tidak ada deadline mendatang'}</small></div></div>
 <div class="grid g4"><div class="card st"><b>${a.length}</b>Tugas aktif</div><div class="card st"><b>${dl}</b>Deadline hari ini</div><div class="card st"><b>${mt}</b>Meeting hari ini</div><div class="card st"><b>${ov}%</b>Progress akademik</div></div>${finStrip()}
 <div class="grid g2"><div class="card"><h2>Fokus hari ini</h2>${td.length?td.map(e=>`<div class="row"><b style="width:52px">${e.t.replace(':','.')}</b><div class="f">${esc(e.n)}<br><span class="mu">${e.k} • ${esc(e.s)}</span></div></div>`).join(''):'<p class="mu">Belum ada agenda hari ini. Tambahkan lewat tombol + Tambah.</p>'}</div>
 <div class="card"><h2>Tindakan selanjutnya</h2>${na.length?na.slice(0,4).map((x,i)=>`<div class="row r${x.c}"><div class="f"><b>${i+1}. ${esc(x.t)}</b><span class="mu">${esc(x.s)}</span></div>${x.id?`<button data-a="fokus" data-id="${x.id}">Fokus</button>`:''}</div>`).join(''):'<p class="mu">Semua beres. Nikmati harimu.</p>'}</div></div>
 <div class="grid g2"><div class="card"><h2>Deadline terdekat</h2>${near.slice(0,4).map(t=>taskRow(t,1)).join('')||'<p class="mu">Tidak ada tugas aktif.</p>'}</div>
 <div class="card"><h2>Waktu luang hari ini</h2>${ft.map(f=>`<div class="row"><div class="f"><b>${hm(f[0])}–${hm(f[1])}</b><span class="mu">${Math.floor((f[1]-f[0])/60)} jam ${(f[1]-f[0])%60} menit kosong</span></div><button class="p" data-a="fokus">Mulai sesi fokus</button></div>`).join('')||'<p class="mu">Tidak ada celah waktu ≥45 menit tersisa hari ini.</p>'}</div></div>`},
tugas(){const tdd=ds(new Date()),F={Semua:t=>1,'Hari ini':t=>t.status!='SELESAI'&&t.due.slice(0,10)==tdd,Mendatang:t=>t.status!='SELESAI'&&hrs(t)>=0,Terlambat:t=>risk(t)=='T',Selesai:t=>t.status=='SELESAI'};
 const L=S.tasks.filter(F[ui.tf]).sort((a,b)=>score(b)-score(a));
 return`<h1>Tugas & PR</h1><div class="tabs" style="margin-top:12px">${Object.keys(F).map(k=>`<button class="${ui.tf==k?'on':''}" data-a="tf" data-id="${k}">${k} (${S.tasks.filter(F[k]).length})</button>`).join('')}<span class="sp"></span><button class="p" data-a="newT">+ Tambah tugas</button></div>${L.map(t=>taskRow(t)).join('')||'<p class="mu">Belum ada tugas di kategori ini.</p>'}`},
kal(){const d=ui.cd,M=ui.cal;let body='';
 const dayEv=x=>events(x).map(e=>`<div class="ev ${e.k}"><b>${e.t.replace(':','.')}</b> ${esc(e.n)}</div>`).join('');
